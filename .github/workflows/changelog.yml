name: Changelog

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  changelog:
    name: regenerate CHANGELOG.md (git-cliff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Generate the full changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: "--verbose --config-url https://raw.githubusercontent.com/elcoosp/docs-toolkit/main/git-cliff/cliff.toml"
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Commit the updated changelog
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "changelog unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): update changelog"
          git push "https://${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
